site_name: risktools
site_description: Python library for commodity trading analytics and financial risk management
repo_url: https://github.com/bbcho/risktools-dev
repo_name: bbcho/risktools-dev

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: getting_started.md
    - Data Reference: data_reference.md
  - Conceptual Guides:
    - Performance Analytics: guides/performance_analytics.md
    - Stochastic Processes: guides/stochastic_processes.md
    - Fixed Income: guides/fixed_income.md
    - Options Pricing: guides/options_pricing.md
  - API Reference:
    - Performance Analytics: api/performance.md
    - Simulations: api/simulations.md
    - Fixed Income & Derivatives: api/fixed_income.md
    - Charting: api/charting.md
    - Refinery Optimization: api/refinery.md
    - Data: api/data.md
